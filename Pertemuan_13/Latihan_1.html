<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan_1</title> <style>
        * {
            box-sizing: border-box;
        }

        .grid-container {
            padding: 10px;
            height: 90vh;
            border: 2px solid black; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: repeat(3, 100px);
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .item {
            background-color: #4A90E2;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
        <div class="item item5">5</div>
        <div class="item item6">6</div>
    </div>
</body>
</html>
